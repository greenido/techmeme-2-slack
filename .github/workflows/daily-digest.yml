name: Daily Tech Digest

on:
  schedule:
    # 10:00 UTC (3:00 AM PT). GitHub often starts scheduled runs hours late,
    # so this aims for delivery during the US morning.
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI
    inputs:
      force:
        description: 'Post even if a digest was already sent today'
        type: boolean
        default: false

# contents: write lets the job commit data/sent-stories.json. The daily commit
# also keeps this public repo "active", so GitHub never auto-disables the
# schedule after 60 days without commits.
permissions:
  contents: write

# Never run two digests at once (e.g. a manual run overlapping the schedule)
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional: a separate Telegram chat for failure alerts (not the digest channel)
      ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Techmeme digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start -- ${{ inputs.force && '--force' || '' }}

      # Runs even if one delivery target failed: the script still records the
      # stories that reached the other target.
      - name: Commit sent-story history
        if: ${{ !cancelled() }}
        run: |
          # Refuse to commit tokens or personal data (see test/data-hygiene.test.js)
          node --test test/data-hygiene.test.js
          git add data/sent-stories.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No history changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898289+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record sent digest stories"
          git pull --rebase
          git push

      - name: Send failure alert
        if: ${{ failure() && env.ALERT_TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALERT_TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Techmeme digest run failed: ${RUN_URL}" \
            > /dev/null
